[package]
name = "smartformat"
description = "Rust port of SmartFormat.NET — string templating with named placeholders, pluralization, and conditional formatting, compatible with SmartFormat template syntax."
keywords = ["formatting", "templating", "localization", "pluralization", "smartformat"]
categories = ["template-engine", "internationalization", "value-formatting"]
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["derive", "plural", "time", "regex-formatters"]
# Re-exports the ToSmartValue derive macro.
derive = ["dep:smartformat-derive"]
# PluralLocalizationFormatter and the pluralization rules it picks words with.
# The rules are a port of SmartFormat.NET's own table, so this pulls in no
# dependency and no CLDR data — the point is to agree with .NET, not with CLDR.
plural = []
# Value::DateTime and .NET date/time format patterns, backed by jiff.
time = ["dep:jiff"]
# IsMatchFormatter. Dependencies land with milestone M3.
regex-formatters = []

[dependencies]
smartformat-derive = { version = "0.1.0", path = "../smartformat-derive", optional = true }
jiff = { version = "0.2", optional = true }

[dev-dependencies]
# Test-only: the golden file is JSON. Normal builds stay serde-free (DESIGN.md).
# `arbitrary_precision` keeps each number's literal text, so a golden double is
# parsed by the standard library rather than serde_json's own float parser,
# which is off by an ulp for some inputs.
serde_json = { version = "1", features = ["arbitrary_precision"] }
