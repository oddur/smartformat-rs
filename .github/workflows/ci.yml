name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --workspace --all-features
      - name: Docs
        run: cargo doc --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # `fuzz/` and `tools/difffuzz/` declare their own `[workspace]`, so they are
  # invisible to every `--workspace` command above. Without this job a change
  # to a public API breaks them and nothing says so until someone runs a
  # campaign months later.
  detached-crates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: The differential fuzzer
        working-directory: tools/difffuzz
        run: cargo clippy --all-targets -- -D warnings
      # cargo-fuzz targets need nightly for the sanitizer flags; `cargo check`
      # on the crate is enough to catch an API that moved under them.
      - name: The fuzz targets
        working-directory: fuzz
        run: cargo +nightly check --all-targets

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.75.0
      - uses: Swatinem/rust-cache@v2
      # Library only (no --all-targets): rust-version promises the crates
      # build as dependencies; dev-dependencies like criterion may need newer.
      - name: Check on the minimum supported Rust version
        run: cargo check --workspace --all-features
